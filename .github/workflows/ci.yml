# Checks every pull request. Deliberately the same three commands you'd run locally —
# CI must never fail on something that passes on your machine.
#
# `npm test && npm run lint && npm run build` is a strict superset of `npm run check`
# (build = tsc -b && vite build), so running both would only run tsc twice.
name: CI

on:
  pull_request:

# Nothing here writes anywhere.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Plain checkout, no sparse-checkout or filter: examples.test.ts reads the
      # committed public/data/catalog.json straight off the working tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # ~/.npm only. Caching node_modules would preserve node_modules/.tmp/*.tsbuildinfo
          # and let `tsc -b` skip a genuinely broken build.
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
